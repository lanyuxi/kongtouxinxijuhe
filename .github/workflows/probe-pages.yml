name: Probe Enable Pages
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try create Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== token info =="
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages -w "\nGET_HTTP:%{http_code}\n" || true
          echo "== try create =="
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' -w "\nPOST_HTTP:%{http_code}\n" || true
