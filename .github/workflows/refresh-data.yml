# 计划每 10 分钟检查；GitHub 调度可能延迟。内容不变也发布本轮检查状态。
# GITHUB_TOKEN 的 push 不会触发另一条 push 工作流，因此在本工作流直接部署。

name: 抓取并发布空投数据

on:
  schedule:
    # 每 10 分钟一次（避开整点，减少与其他任务撞车）
    - cron: '3,13,23,33,43,53 * * * *'
  # 允许被前端「一键更新」通过 repository_dispatch 触发
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:

# 需要写权限才能把新数据提交回仓库
permissions:
  contents: write
  pages: write
  id-token: write

# 抓取任务串行执行；排队中的旧任务直接取消，正在跑的跑完
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: 抓取并检查数据
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # 用内置 token 推回仓库，无需额外配置任何密钥
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 抓取并生成数据
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run pipeline

      # 新增项目要在这里补图标；已抓过的直接复用本地文件，不会重复下载。
      - name: 抓取项目 Logo
        run: npm run logos

      # 顺序说明（2026-09-15 修）：构建必须排在单元测试之前。
      #   tests/galaxy-ui.test.ts 断言 dist/assets/*.css 里的关键类是否产出，
      #   需要 dist/ 存在才能运行。原先的顺序会让它必然失败，
      #   进而让「数据变化检查与提交」被跳过 —— 数据因此一直无法提交回仓库。
      - name: 构建站点
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 发布前校验
        run: npm run validate

      - name: 数据变化检查与提交
        id: commit
        run: |
          git config user.name "dropscope-data-bot"
          git config user.email "dropscope-data-bot@users.noreply.github.com"

          # 只关心数据的「实质内容」是否变化。
          #
          # 为什么不能直接 `git diff --quiet -- data/`：
          #   data/ 里的 last_checked_at / sources[].fetched_at / updated_at
          #   每轮必变，直接比对会让每 10 分钟都产生一次无意义提交与部署，
          #   并把前端「数据变化时间」永远推成「刚刚」。
          #   pipeline 已用剔除时间戳后的指纹判定过实质变化，结果在 refresh-status.json。
          CHANGED=$(node -e "try{const s=require('./data/refresh-status.json');process.stdout.write(String(s.data_changed===true))}catch(e){process.stdout.write('false')}")
          SUMMARY=$(node -e "try{const s=require('./data/refresh-status.json');process.stdout.write(s.change_summary||'-')}catch(e){process.stdout.write('-')}")
          echo "变化摘要：$SUMMARY"

          if [ "$CHANGED" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本轮无实质内容变化，跳过提交"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          # 图标要跟数据一起提交：新增项目的 logo 必须进仓库，
          # 否则线上列表会出现只有数据、没有图标的破图。
          git add data/ public/logos
          git commit -m "chore(data): 定时更新空投数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "已提交并推送数据更新：$SUMMARY"

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 无实质内容变化只跳过 Git 提交，仍上传本轮已检查的站点和运行时间。
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 保存本轮检查与失败报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 本轮运行报告
          path: |
            data/source-health.json
            data/refresh-status.json
            data/translation-pending.json

  deploy:
    name: 发布本轮已检查的站点
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 写入实际发布时间
        run: echo "成功发布时间（UTC）：$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
