# 空投情报平台 · GitHub Actions 部署流水线
#
# 作用：
#   1) 拉取最新代码 → 安装依赖 → 抓取数据 → 跑单测 → 跑发布前校验 → 构建 dist/
#   2) 把 dist/ 发布到 GitHub Pages，得到固定、可对外分享的在线预览地址
#
# 触发方式：
#   - push 到 main / master：自动构建并部署
#   - 手动触发（Actions 页面点击 Run workflow）
#
# 重要：GitHub Pages 项目站点运行在子路径 https://<用户>.github.io/<仓库名>/，
#      因此构建时把 BASE_PATH 设为 /<仓库名>/，保证 JS / CSS / data 资源路径正确。
#      vite.config.ts 的 base 默认 './'（相对路径），仅在本文件显式覆盖为绝对子路径。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务；排队中的旧任务取消，但正在发布的任务不打断
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 抓取并生成数据
        run: npm run pipeline

      # 列表页要求「每个项目都有真实官方图标」，
      # 这里补齐 public/logos 后再跑覆盖率校验，缺图会直接让部署失败。
      - name: 抓取项目 Logo
        run: npm run logos

      # 顺序说明（2026-09-15 修）：构建必须排在单元测试之前。
      #   tests/galaxy-ui.test.ts 断言的是 `dist/assets/*.css` 里的关键类是否产出 ——
      #   也就是「用户真正拿到的那份 CSS」。它需要 dist/ 存在才能运行。
      #   原先的顺序是 测试 → 校验 → 构建，该测试必然因缺 dist/ 而失败。
      #   这个顺序问题此前一直被「抓取项目 Logo」更早的失败掩盖着（四个后续步骤全被跳过），
      #   直到那一处修好才暴露出来。
      - name: 构建站点
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # feed 里必须是可点的绝对地址，因此显式传入站点根地址
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 发布前校验
        run: npm run validate

      - name: 构建产物自检
        run: |
          test -f dist/index.html
          test -f dist/data/airdrops.json
          test -f dist/data/logo-map.json
          test -d dist/data/details
          test -d dist/logos
          # feed 是构建期生成物：缺失时订阅者只会看到 404，而站点本身完全正常，
          # 属于「静默失败」，因此必须在部署前断言
          test -f dist/feed.xml
          # 图标数量必须与数据条目一致，避免线上出现破图
          COUNT=$(node -e "process.stdout.write(String(require('./data/logo-map.json').total))")
          test "$(ls dist/logos | wc -l)" -ge "$COUNT"
          echo "dist/ 就绪，文件数：$(find dist -type f | wc -l)，图标 $COUNT 个"

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库若尚未开启 Pages，允许该步骤直接创建 Pages 站点（Source = GitHub Actions）
          enablement: true

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
